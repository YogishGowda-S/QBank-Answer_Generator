<!DOCTYPE html>
<html>
<head><title>Upload Files</title></head>
<body>
    <h2>Upload Files</h2>
    <p>Hold <strong>Ctrl</strong> and click to select multiple files at once.</p>

    <form method="POST" enctype="multipart/form-data">

        <label><strong>Question Bank files (.docx) — can select multiple:</strong></label><br>
        <input type="file" name="qbank" accept=".docx" multiple required>
        <br><br>

        <label><strong>Notes files (.pdf) — can select multiple:</strong></label><br>
        <input type="file" name="notes" accept=".pdf" multiple required>
        <br><br>

        <button type="submit" id="submitBtn">Upload & Generate Answers</button>
    </form>

    <p id="waitMsg" style="display:none; color:green;">
        ⏳ Generating answers... please wait, do not refresh.
    </p>

    <br>
    <a href="/dashboard">Back to Dashboard</a>

    <script>
        document.querySelector("form").addEventListener("submit", function() {
            document.getElementById("submitBtn").disabled = true;
            document.getElementById("submitBtn").innerText = "Please wait...";
            document.getElementById("waitMsg").style.display = "block";
        });
    </script>
</body>
</html>
